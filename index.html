<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Consolidated Data Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        h1 {
            color: #333;
            font-size: 24px;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            color: #27ae60;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .loading {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #667eea;
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 20px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <div class="logo">
                <img src="boat-logo.png" alt="Boat Logo">
            </div>
            <h1>Consolidated Data Management</h1>
            <p class="subtitle">अपने खाते में लॉगिन करें</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" name="userId" required placeholder="अपना User ID दर्ज करें">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="अपना Password दर्ज करें">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Login</button>

            <div class="loading" id="loadingMsg">Processing...</div>
            <div class="error-message" id="errorMsg">गलत User ID या Password!</div>
            <div class="success-message" id="successMsg">Login सफल! Dashboard पर जा रहे हैं...</div>
        </form>
    </div>

    <script>
        // Valid User IDs aur Passwords
        const validCredentials = {
            'dbt.help@boatnr.org': 'DBT2026',
            'nats.kanpur@boatnr.org': 'NATS2026',
            'boat.outreach@boatnr.org': 'OUTREACH2026',
            'admin': 'admin123'
        };

        // User roles
        const userRoles = {
            'dbt.help@boatnr.org': 'user',
            'nats.kanpur@boatnr.org': 'user',
            'boat.outreach@boatnr.org': 'user',
            'admin': 'admin'
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const loadingMsg = document.getElementById('loadingMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            // Messages ko hide karo
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            loadingMsg.style.display = 'none';
            
            // Check karo credentials
            if (validCredentials[userId] && validCredentials[userId] === password) {
                // Login successful
                loginBtn.disabled = true;
                loadingMsg.style.display = 'block';
                
                // User info save karo localStorage mein
                const userInfo = {
                    userId: userId,
                    role: userRoles[userId],
                    loginTime: new Date().toISOString()
                };
                
                localStorage.setItem('userInfo', JSON.stringify(userInfo));
                
                // Success message dikhaao
                setTimeout(() => {
                    loadingMsg.style.display = 'none';
                    successMsg.style.display = 'block';
                    
                    // dashboard.html par redirect karo
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                }, 1000);
                
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
